[package]
name = "staking-program"
version = "0.1.0"
description = "Solana staking and fee-routing program for Pump.fun-launched tokens"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "staked"

[features]
default = ["custom-panic", "no-idl", "no-log-ix-name"]
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.32.1"
solana-security-txt = "1.1.3"
